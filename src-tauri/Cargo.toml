[workspace]
members = ["crates/skiu-core", "crates/skiu-win"]

[package]
name = "skiu-vibrance"
version = "1.2.0"
description = "Skiu Vibrance - vibrance NVIDIA automatique par jeu"
authors = ["CeA Solutions"]
edition = "2021"
rust-version = "1.82"

[lib]
name = "skiu_vibrance_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-dialog = "2"
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
skiu-core = { path = "crates/skiu-core" }
skiu-win = { path = "crates/skiu-win" }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
