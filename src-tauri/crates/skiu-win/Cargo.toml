[package]
name = "skiu-win"
version = "1.1.0"
edition = "2021"

[dependencies]
skiu-core = { path = "../skiu-core" }
windows-sys = { version = "0.59", features = [
  "Win32_Foundation",
  "Win32_Graphics_Dwm",
  "Win32_Graphics_Gdi",
  "Win32_System_LibraryLoader",
  "Win32_System_Threading",
  "Win32_UI_WindowsAndMessaging",
] }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(skiu_typecheck)'] }
