name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: Tests & verifications
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
      - run: npm ci
      - name: Interface (TypeScript + build)
        run: npm run build

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Format
        working-directory: src-tauri
        run: cargo fmt --all --check
      - name: Tests de la logique (skiu-core)
        working-directory: src-tauri
        run: cargo test -p skiu-core
      - name: Clippy skiu-core
        working-directory: src-tauri
        run: cargo clippy -p skiu-core --all-targets -- -D warnings
      - name: Verification des types Windows (skiu-win)
        working-directory: src-tauri
        env:
          RUSTFLAGS: --cfg skiu_typecheck
        run: cargo check -p skiu-win

  windows:
    name: Application complete (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Versions identiques partout
        shell: pwsh
        run: |
          # Table de hachage : le lockfile contient une cle vide ("") pour le paquet racine.
          $lock = Get-Content package-lock.json -Raw | ConvertFrom-Json -AsHashtable
          $versions = @(
            (Get-Content package.json -Raw | ConvertFrom-Json).version
            $lock['version']
            $lock['packages']['']['version']
            (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          )
          foreach ($f in 'src-tauri/Cargo.toml', 'src-tauri/crates/skiu-core/Cargo.toml', 'src-tauri/crates/skiu-win/Cargo.toml') {
            $versions += [regex]::Match((Get-Content $f -Raw), '(?m)^version\s*=\s*"([^"]+)"').Groups[1].Value
          }
          $unique = @($versions | Sort-Object -Unique)
          if ($unique.Count -ne 1) { throw "Versions differentes : $($versions -join ', ')" }

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
      - run: npm ci
      # Le dossier dist est requis pour compiler l'application Tauri.
      - run: npm run build

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Clippy (tout le workspace)
        working-directory: src-tauri
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Tests (tout le workspace)
        working-directory: src-tauri
        run: cargo test --workspace
