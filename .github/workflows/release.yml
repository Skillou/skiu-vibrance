name: Release

# Pousser un tag `v1.2.3` (identique a la version de tauri.conf.json) construit
# l'installateur Windows signe, publie la release et le fichier `latest.json`
# que l'application consulte pour se mettre a jour.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verifier que le tag correspond a la version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $v = (Get-Content src-tauri/tauri.conf.json | ConvertFrom-Json).version
          if ("v$v" -ne "${{ github.ref_name }}") { throw "Tag ${{ github.ref_name }} different de la version v$v" }

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - run: cargo test --workspace
        working-directory: src-tauri

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Skiu Vibrance ${{ github.ref_name }}
          releaseBody: |
            Telecharge `Skiu.Vibrance_*_x64-setup.exe` ci-dessous pour installer.
            Si Skiu Vibrance est deja installe, il te propose cette version tout seul.
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
          updaterJsonPreferNsis: true
